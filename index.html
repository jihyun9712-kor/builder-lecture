<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>직업 매칭 정보 입력</title>
  <link href='style.css' rel='stylesheet'>
</head>
<body>
  <div class="theme-toggle">
    <button id="theme-btn">🌙 다크 모드</button>
  </div>

  <div class="form-container">
    <h2>직업 매칭 정보 입력</h2>
    <form action="https://formspree.io/f/mreawnzj" method="POST">
      <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" name="이름" required placeholder="이름을 입력하세요">
      </div>
      <div class="form-group">
        <label for="job-category">희망하는 대분류 직업군</label>
        <select id="job-category" name="희망_직업군" required>
          <option value="" disabled selected>직업군을 선택하세요</option>
          <option value="경영·사무·금융·보험">경영·사무·금융·보험</option>
          <option value="연구·공학·기술">연구·공학·기술</option>
          <option value="교육·법률·사회복지">교육·법률·사회복지</option>
          <option value="보건·의료">보건·의료</option>
          <option value="예술·디자인·방송·스포츠">예술·디자인·방송·스포츠</option>
          <option value="미용·여행·숙박·음식·경비">미용·여행·숙박·음식·경비</option>
          <option value="영업·판매·운송">영업·판매·운송</option>
          <option value="건설·채굴">건설·채굴</option>
          <option value="설치·정비·생산">설치·정비·생산</option>
          <option value="농림어업">농림어업</option>
        </select>
      </div>
      <div class="form-group">
        <label for="strengths">자신의 핵심 강점</label>
        <textarea id="strengths" name="핵심_강점" placeholder="본인만의 강점이나 전문성을 자유롭게 적어주세요"></textarea>
      </div>
      <div class="form-group">
        <label for="message">추가 문의사항</label>
        <textarea id="message" name="메시지" placeholder="원하는 구체적인 직무나 궁금한 점을 적어주세요"></textarea>
      </div>
      <button type="submit" class="submit-btn">나에게 맞는 직업 찾기</button>
    </form>
  </div>

  <div class="comments-container">
    <div id="disqus_thread"></div>
  </div>

  <script>
    var disqus_config = function () {
      this.page.url = window.location.href;
      this.page.identifier = window.location.pathname;
      this.page.developer = 1; // 로컬 테스트 및 개발 시 필요할 수 있음
    };
    (function() { 
    var d = document, s = d.createElement('script');
    s.src = 'https://productbeginner.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
    })();
  </script>
  <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
  <script defer type="text/javascript" src="main.js"></script>
</body>
</html>
