<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>직업 매칭 정보 입력</title>
  <link href='style.css' rel='stylesheet'>
</head>
<body>
  <div class="theme-toggle">
    <button id="theme-btn">🌙 다크 모드</button>
  </div>

  <div class="form-container" id="step-form-container">
    <div class="step-indicator">
      <div class="step active" data-step="1">1</div>
      <div class="step-line"></div>
      <div class="step" data-step="2">2</div>
      <div class="step-line"></div>
      <div class="step" data-step="3">3</div>
    </div>

    <form id="multi-step-form">
      <!-- Step 1: Keywords -->
      <div class="form-step active" id="step-1">
        <h2>1단계: 강점 키워드 선택</h2>
        <p class="step-desc">본인을 가장 잘 나타내는 강점 3개를 선택해주세요.</p>
        <div class="keyword-grid" id="keyword-selection">
          <div class="keyword-chip" data-value="논리적">논리적</div>
          <div class="keyword-chip" data-value="창의적">창의적</div>
          <div class="keyword-chip" data-value="사교적">사교적</div>
          <div class="keyword-chip" data-value="꼼꼼함">꼼꼼함</div>
          <div class="keyword-chip" data-value="분석적">분석적</div>
          <div class="keyword-chip" data-value="리더십">리더십</div>
          <div class="keyword-chip" data-value="책임감">책임감</div>
          <div class="keyword-chip" data-value="적응력">적응력</div>
          <div class="keyword-chip" data-value="추진력">추진력</div>
          <div class="keyword-chip" data-value="공감능력">공감능력</div>
          <div class="keyword-chip" data-value="성실함">성실함</div>
          <div class="keyword-chip" data-value="도전적">도전적</div>
        </div>
        <input type="hidden" id="selected-keywords-input" name="keywords" required>
        <button type="button" class="submit-btn next-btn" disabled>다음 단계로</button>
      </div>

      <!-- Step 2: Experience -->
      <div class="form-step" id="step-2">
        <h2>2단계: 경험 기술하기</h2>
        <p class="step-desc">선택한 강점을 발휘했던 짧은 경험을 한 줄로 적어주세요.</p>
        <div class="form-group">
          <label for="experience">강점 발휘 경험</label>
          <textarea id="experience" name="경험" placeholder="예: 팀 프로젝트 시 논리적인 분석을 통해 문제를 해결한 경험이 있습니다."></textarea>
        </div>
        <div class="btn-group">
          <button type="button" class="submit-btn prev-btn secondary">이전</button>
          <button type="button" class="submit-btn next-btn">다음 단계로</button>
        </div>
      </div>

      <!-- Step 3: Work Style -->
      <div class="form-step" id="step-3">
        <h2>3단계: 선호 근무 형태</h2>
        <p class="step-desc">본인이 가장 선호하는 업무 환경을 선택해주세요.</p>
        <div class="work-style-options">
          <label class="work-option">
            <input type="radio" name="work_style" value="원격 근무" checked>
            <div class="option-card">
              <span class="icon">🏠</span>
              <span class="label">원격 근무</span>
              <span class="desc">장소에 구애받지 않는 자유로운 환경</span>
            </div>
          </label>
          <label class="work-option">
            <input type="radio" name="work_style" value="사무실 출근">
            <div class="option-card">
              <span class="icon">🏢</span>
              <span class="label">사무실 출근</span>
              <span class="desc">동료들과 대면하며 협업하는 환경</span>
            </div>
          </label>
        </div>
        <div class="btn-group">
          <button type="button" class="submit-btn prev-btn secondary">이전</button>
          <button type="submit" class="submit-btn">나에게 맞는 직업 찾기</button>
        </div>
      </div>
    </form>
  </div>

  <div id="result-container" class="form-container" style="display: none;">
    <h2>나에게 맞는 추천 직업</h2>
    <div id="job-results"></div>
    <button onclick="location.reload()" class="submit-btn retry-btn">다시 시도하기</button>
  </div>

  <script defer type="text/javascript" src="main.js"></script>
</body>
</html>
